name: Build PowerSound Player APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/PowerSoundPlayer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PowerSoundPlayer-apk
          path: out/PowerSoundPlayer.apk

      - name: Publish release (used by the in-app updater)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: PowerSound Player 1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: out/PowerSoundPlayer.apk
          make_latest: true
